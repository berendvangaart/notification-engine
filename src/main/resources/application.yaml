spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_engine
    username: notification
    password: notification
  jpa:
    hibernate:
      ddl-auto: validate          # Liquibase owns the schema, not Hibernate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifications.intake-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.github.berendvangaart.notification_engine"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kind: Application