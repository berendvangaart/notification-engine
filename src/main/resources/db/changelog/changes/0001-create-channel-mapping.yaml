databaseChangeLog:
  - changeSet:
      id: 0001
      author: berend
      changes:
        - createTable:
            tableName: channel_mapping
            columns:
              - column:
                  name: mapping_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: destination
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: channel_mapping
            indexName: idx_channel_mapping_event_type
            columns:
              - column:
                  name: event_type